<html>
    <head>
        <title>Electronjs</title>
        <link rel="stylesheet" href="../css/bootstrap.min.css" />
        <link rel="stylesheet" href="../css/styles.css" />
    </head>
    <body background="../img/fundo.png" style="background-size: cover;"> <!--style="background-color: lightblue;"-->
        <div class="modal" tabindex="-1" id="modal-exibir-mensagem">
            <div class="modal-dialog">
                <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Alerta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modal-mensagem"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Ok</button>
                </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="modal-configuracoes" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Configurações</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">Usuário</span>
                            <input type="text" class="form-control" id="iUsuarioConfiguracoes" placeholder="Usuário" aria-label="Usuario" aria-describedby="basic-addon1">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">Senha</span>
                            <input type="password" class="form-control" id="iSenhaConfiguracoes" placeholder="Usuário" aria-label="Usuario" aria-describedby="basic-addon1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                        <button type="button" class="btn btn-primary" id="bLogarConfiguracoes">Entrar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-12 d-grid gap-2">
                    <img src="../img/logo.png" style="width: 150; height: auto; margin: 0 auto;"/>
                    <input type="text" id="iUsuario" class="form-control" placeholder="Usuário"/>
                    <input type="password" id="iSenha" class="form-control" placeholder="Senha"/>
                    <button class="btn btn-outline-success" id="bEntrar">Entrar</button>
                    <button class="btn btn-outline-danger" id="bFechar">Fechar</button>
                    <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modal-configuracoes"><img src="../img/icone-engrenagens.gif" /></button>
                </div>
            </div>
        </div>
        <script src="../js/jquery-3.7.1.min.js"></script>
        <script src="../js/bootstrap.min.js"></script>
        <script src="../js/socket.io.min.js"></script>
        <script src="../js/config.js"></script>
        <script src="../renderer.js"></script>
        <script src="../js/login.js"></script>
    </body>
</html>
