<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/configuracoes.css" />
</head>
<body background="../img/fundo-configuracoes.png" style="background-size: cover;">
    <div class="modal fade" id="modal-exibir-mensagem" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Mensagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h3 id="modal-mensagem"></h3>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modal-adicionar-usuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adicionar usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1">Nome</span>
                        <input type="text" class="form-control" id="iAdicionarNome" placeholder="Nome" aria-label="Nome" aria-describedby="basic-addon1">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1">Usuário</span>
                        <input type="text" class="form-control" id="iAdicionarUsuario" placeholder="Usuário" aria-label="Usuario" aria-describedby="basic-addon1">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1">Senha</span>
                        <input type="password" disabled="true" class="form-control" id="iAdicionarSenha" placeholder="Senha" value="12345" aria-label="Usuario" aria-describedby="basic-addon1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="bAdicionarUsuario">Salvar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modal-editar-usuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="iEditarID" />
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1">Usuário</span>
                        <input type="text" class="form-control" id="iEditarUsuario" placeholder="Usuário" aria-label="Usuario" aria-describedby="basic-addon1">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1">Senha</span>
                        <input type="password" disabled="true" class="form-control" id="iEditarSenha" placeholder="Senha" aria-label="Usuario" aria-describedby="basic-addon1">
                        <button type="button" class="btn btn-secondary" id="bResetarSenha">Resetar senha</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-primary" id="bLogarConfiguracoes">Salvar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="botoesAcao">
                    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modal-adicionar-usuario">Adicionar usuário</button>
                </div>
            </div>
            <br/>
            <div class="col-12">
                <table class="table table-hover" id="tableUsuario">
                    <thead>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Usuário</th>
                        <th>Senha</th>
                        <th>Ações</th>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/configuracoes.js"></script>
</body>
</html>
